# Uploads website/public to the Hetzner webhosting (coocoo.dev) over SFTP on every push to master
# that touches the website. Setup (secrets, host key): website/README.md.
name: Website deploy

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Verbose SSH connection test before the upload'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: find website -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ secrets.HETZNER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.HETZNER_SFTP_USER }}
          SFTP_KEY: ${{ secrets.HETZNER_SFTP_KEY }}
          LFTP_PASSWORD: ${{ secrets.HETZNER_SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.HETZNER_SFTP_PATH }}
          SFTP_KNOWN_HOSTS: ${{ secrets.HETZNER_SFTP_KNOWN_HOSTS }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PATH" ] || { [ -z "$SFTP_KEY" ] && [ -z "$LFTP_PASSWORD" ]; }; then
            echo "::warning::HETZNER_SFTP_* secrets are not set; skipping the upload (see website/README.md)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$SFTP_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
            confirm=no
          else
            echo "::warning::HETZNER_SFTP_KNOWN_HOSTS is not set; accepting the server's host key unverified."
            confirm=yes
          fi
          if [ -n "$SFTP_KEY" ]; then
            # Key login (Hetzner: main FTP user only). The empty password after the comma keeps
            # lftp from asking for one.
            printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
            if [ "${{ inputs.debug }}" = "true" ]; then
              ssh-keygen -l -f ~/.ssh/deploy_key || true
              printf -- '-pwd\n-df -h\n-ls -la %s\n-put website/public/robots.txt zz-deploy-test.txt\n-rm zz-deploy-test.txt\n-put website/public/robots.txt public_html/zz-deploy-test.txt\n-rm public_html/zz-deploy-test.txt\n-put website/public/robots.txt %s/zz-deploy-test.txt\n-rm %s/zz-deploy-test.txt\n' \
                "$SFTP_PATH" "$SFTP_PATH" "$SFTP_PATH" \
                | sftp -v -b - -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
                  -o StrictHostKeyChecking=accept-new "$SFTP_USER@$SFTP_HOST" || true
            fi
            auth="set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes'
            open -u '$SFTP_USER,' 'sftp://$SFTP_HOST'"
          else
            auth="open --env-password -u '$SFTP_USER' 'sftp://$SFTP_HOST'"
          fi
          # cache/*.json lives only on the server: excluded from upload and from --delete.
          lftp -c "
            set sftp:auto-confirm $confirm
            set net:max-retries 2
            set net:timeout 20
            $auth
            $([ "${{ inputs.debug }}" = "true" ] && echo 'debug 3')
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob 'cache/*.json' --exclude-glob 'cache/tmp*' \
              website/public/ '$SFTP_PATH'
          "
