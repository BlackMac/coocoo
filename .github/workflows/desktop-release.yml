# Builds the Tauri desktop app (deb, AppImage, dmg, nsis) and publishes it as a GitHub release.
# The web UI's download icon links to /releases/latest, so every pushed `v*` tag ships installers.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            src-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: npm ci
        run: |
          npm ci --prefix ui
          npm ci --prefix src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Coocoo ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: 'Desktop app installers. Linux: .deb / .AppImage, macOS: .dmg (universal, ad-hoc signed: on first launch right-click the app → Open), Windows: -setup.exe.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
