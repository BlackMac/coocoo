[package]
name = "coocoo-core"
description = "Coocoo daemon: config, HTTP/WebSocket server, routing, peers (direct + SSH), embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["embed-ui"]
# Embed ui/dist into the binary so headless servers serve the web/phone UI.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
coocoo-proto.workspace = true
coocoo-agents.workspace = true
coocoo-browser.workspace = true
coocoo-workspace.workspace = true
coocoo-insights.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
axum.workspace = true
tracing.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
libc.workspace = true
toml.workspace = true
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
web-push = { version = "0.11", default-features = false }
ece = { version = "2.2", default-features = false, features = ["serializable-keys"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-tokio", "ring", "tls12"] }
base64.workspace = true
http-body-util = "0.1"

[dev-dependencies]
ece = { version = "2.2", default-features = false, features = ["serializable-keys", "backend-test-helper"] }
