[package]
name = "coocoo-core"
description = "Coocoo daemon: config, HTTP/WebSocket server, routing, peers (direct + SSH), embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["embed-ui"]
# Embed ui/dist into the binary so headless servers serve the web/phone UI.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
coocoo-proto.workspace = true
coocoo-agents.workspace = true
coocoo-browser.workspace = true
coocoo-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
axum.workspace = true
tracing.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "display"] }
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
